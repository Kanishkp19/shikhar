let ap="August", openW=new Set([1]);

function cdntn(){
  const now=new Date(), aug1=new Date(2026,7,1), exam=new Date(2026,10,29);
  const toStart=Math.ceil((aug1-now)/(1000*60*60*24));
  const el=document.getElementById("cntdn"), ll=document.getElementById("cntdn-lbl");
  if(toStart>0){el.textContent=toStart;ll.textContent="Days to Aug 1";}
  else {
    const toExam=Math.ceil((exam-now)/(1000*60*60*24));
    if(toExam>0){
      const day=Math.abs(toStart)+1;
      el.textContent="Day "+day;ll.textContent=toExam+" days to exam";
    } else if(toExam===0){el.textContent="EXAM";ll.textContent="Today. Go get it.";}
    else {el.textContent="Done";ll.textContent="Plan complete";}
  }
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=Object.keys(PH).map(p=>{
    const ph=PH[p], on=ap===p;
    return `<button class="ptab${on?" on":""}" style="${on?`background:${ph.c};color:#fff`:`color:var(--text-secondary)`}" onclick="setPhase('${p}')">${p}</button>`;
  }).join("");
}

function renderPhaseCard(){
  const ph=PH[ap];
  const wks=WEEKS.filter(w=>w.p===ap);
  const days=wks.reduce((s,w)=>s+w.days.length,0);
  const mocks=wks.flatMap(w=>w.days).filter(d=>d.type==="mock").length;
  document.getElementById("pcard").innerHTML=`
  <div class="pcard" style="background:${ph.bg};border-color:${ph.bd}">
    <div class="pcard-row">
      <div>
        <div class="ptitle" style="color:${ph.c}">${ap}: ${ph.t}</div>
        <div class="psub">${ph.h}</div>
      </div>
      <div style="text-align:right;font-size:12px;color:${ph.c};font-weight:500">${days} days · ${mocks} full mock${mocks!==1?"s":""}</div>
    </div>
  </div>`;
}

function renderWeeks(){
  const ph=PH[ap];
  const wks=WEEKS.filter(w=>w.p===ap);
  document.getElementById("weeks").innerHTML=wks.map(wk=>{
    const isOpen=openW.has(wk.w);
    const mocks=wk.days.filter(d=>d.type==="mock").length;
    const daysHtml=isOpen?wk.days.map(d=>{
      const ts=TS[d.type]||{bg:"var(--surface-1)",bd:"var(--border)",tag:null};
      const tagHtml=d.type?`<span class="dtag" style="background:${ts.tc};color:#fff">${ts.tag}</span>`:"";
      return `<div class="dc" style="background:${ts.bg};border-color:${ts.bd}">
        <div class="dtop">
          <span class="dnum">Day ${d.n}</span>
          <span class="ddate">${d.date}</span>
          ${tagHtml}
        </div>
        <div class="dgrid">
          <div class="ds"><div class="dsl" style="color:#16a34a">QA</div><div class="dst">${d.qa}</div></div>
          <div class="ds"><div class="dsl" style="color:#ca8a04">DILR</div><div class="dst">${d.dilr}</div></div>
          <div class="ds"><div class="dsl" style="color:#dc2626">VARC</div><div class="dst">${d.varc}</div></div>
        </div>
        ${d.note?`<div class="dnote">${d.note}</div>`:""}
      </div>`;
    }).join(""):"";
    return `<div class="week">
      <button class="whdr" onclick="togW(${wk.w})">
        <div style="display:flex;align-items:center">
          <div class="wnum" style="background:${ph.c}">W${wk.w}</div>
          <div class="winfo">
            <div class="wtitle">${wk.d} — ${wk.t}</div>
            <div class="wsub">${wk.days.length} days${mocks>0?" · "+mocks+" mock"+(mocks>1?"s":""):""}</div>
          </div>
        </div>
        <i class="ti ti-chevron-${isOpen?"up":"down"}" aria-hidden="true" style="color:var(--text-muted);font-size:16px"></i>
      </button>
      ${isOpen?`<div class="wbody">${daysHtml}</div>`:""}
    </div>`;
  }).join("");
}

function render(){renderTabs();renderPhaseCard();renderWeeks();}
window.setPhase=p=>{ap=p;openW=new Set();render();};
window.togW=w=>{openW.has(w)?openW.delete(w):openW.add(w);renderWeeks();};
cdntn();render();
</script>
